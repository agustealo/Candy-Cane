name: Quality Gate

on:
  push:
    branches:
      - master
      - 'modernize/**'
      - 'test/**'
  pull_request:

permissions:
  contents: read

jobs:
  theme-contract:
    name: Candy Cane preservation contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release metadata and preserved contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -q '^Theme Name: Candy Cane$' style.css
          grep -q '^Version: 0.10.0$' style.css
          grep -q '^Requires PHP: 7.4$' style.css
          grep -q '^Text Domain: candy-cane$' style.css
          grep -q '^License: GNU General Public License v2.0$' style.css
          grep -q '"license": "GPL-2.0-only"' composer.json
          grep -q '"php": ">=7.4"' composer.json

          test -f legacy-style.css
          test ! -f functions-orig.php
          test -z "$(git ls-files '*dwsync.xml' '_notes/*' '*/_notes/*')"

          grep -q "'header-menu1'" inc/class-candy-cane-theme.php
          grep -q "'header-menu2'" inc/class-candy-cane-theme.php
          grep -q "'right_sidebar'" inc/class-candy-cane-theme.php
          grep -q "add_image_size( 'front', 210, 210" inc/class-candy-cane-theme.php
          grep -q "add_image_size( 'name_size', 460, 345" inc/class-candy-cane-theme.php

  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -not -path './tests/reference-theme/*' -print0 | xargs -0 -n1 php -l

  standards:
    name: WordPress coding and PHP compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install quality tooling
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run WordPress standards
        run: composer standards

  wordpress-runtime:
    name: WordPress 7.1.1 runtime + visual preservation
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current Candy Cane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout historical Candy Cane reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agustealo/Candy-Cane
          ref: e3ee7c4e8c1d36751f7643117f89054695feab2b
          path: tests/reference-theme
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Verify Docker Compose
        run: docker compose version

      - name: Install pinned browser tooling
        run: |
          npm install --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Run real WordPress and visual preservation proof
        run: bash tests/visual-preservation.sh

      - name: Upload visual preservation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candy-cane-visual-preservation-${{ github.sha }}
          path: tests/browser-artifacts/
          if-no-files-found: warn
          retention-days: 30
